# =============================================================
# Inventario Taller — Docker Compose para CasaOS
# Instalación:  git clone ... && docker compose up -d
# WebUI:        http://<IP>:8085   |   admin / 1234
# =============================================================
name: inventario-taller

services:

  db:
    image: mysql:8.0
    container_name: inventaller_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPass_Cambia1!
      MYSQL_DATABASE: inventaller
      MYSQL_USER: almacen_local
      MYSQL_PASSWORD: CambiaEstaPassword1!
      TZ: Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventaller_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass_Cambia1!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: inventaller_app:latest
    container_name: inventaller_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - target: 80
        published: 8085
        protocol: tcp
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: inventaller
      DB_USER: almacen_local
      DB_PASS: CambiaEstaPassword1!
    volumes:
      - app_data:/var/www/html
    networks:
      - inventaller_net

volumes:
  db_data:
  app_data:

networks:
  inventaller_net:
    driver: bridge

# Metadatos para CasaOS
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  store_app_id: inventario-taller
  category: utilidades
  title:
    en_us: Inventario Taller
  tagline:
    en_us: Gestión de inventario para taller — IES Miguel de Molinos
  description:
    en_us: Gestión de equipos, ubicaciones y movimientos para el taller del IES.
  port_map: "8085"
  index: /
  scheme: http
  tips:
    before_install:
      en_us: Accede con usuario admin y contraseña 1234 tras el primer arranque.
