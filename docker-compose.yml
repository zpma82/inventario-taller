# =============================================================
# Inventario Taller — Docker Compose para CasaOS
# Uso:    git clone ... && docker compose up -d
# WebUI:  http://<IP>:8085   |  admin / admin
# =============================================================
name: inventario-taller

services:

  db:
    image: mysql:8.0
    container_name: inventaller_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPass_Cambia1!
      MYSQL_DATABASE: inventaller
      MYSQL_USER: almacen_local
      MYSQL_PASSWORD: CambiaEstaPassword1!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventaller_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass_Cambia1!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: inventaller_app:latest
    container_name: inventaller_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: inventaller
      DB_USER: almacen_local
      DB_PASS: CambiaEstaPassword1!
    volumes:
      - app_data:/var/www/html
    networks:
      - inventaller_net
    labels:
      casaos.app.name: "Inventario Taller"
      casaos.app.description: "Gestión de inventario para taller"
      casaos.app.webui.port: "8085"
      casaos.app.webui.path: "/"
      casaos.app.index: "http://localhost:8085"

volumes:
  db_data:
  app_data:

networks:
  inventaller_net:
    name: inventaller_net
    driver: bridge
