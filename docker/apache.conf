ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Forzar UTF-8
    AddDefaultCharset UTF-8
    php_value default_charset "UTF-8"

    # ── Pasar el header Authorization a PHP ─────────────────────
    # Sin esto, PHP no ve $_SERVER['HTTP_AUTHORIZATION'] y
    # todos los endpoints autenticados devuelven respuesta vacía
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Reescribir Authorization a variable de entorno como fallback
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.*)
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride All
        Require all granted

        # Asegurar que PHP recibe Authorization en CGI/FastCGI
        CGIPassAuth On
    </Directory>

    ErrorLog /proc/1/fd/2
    CustomLog /proc/1/fd/1 combined
</VirtualHost>
