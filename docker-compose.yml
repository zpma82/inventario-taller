# =============================================================
# Inventario Taller — Docker Compose para CasaOS
# Importar en CasaOS → Apps → Custom Install → Docker Compose
# WebUI: http://<IP-NAS>:8085
# =============================================================
name: inventario-taller

services:

  db:
    image: mysql:8.0
    container_name: inventaller_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPass_Cambia1!
      MYSQL_DATABASE: inventaller
      MYSQL_USER: almacen_local
      MYSQL_PASSWORD: CambiaEstaPassword1!
    volumes:
      - /DATA/AppData/inventaller/db:/var/lib/mysql
      - /DATA/AppData/inventaller/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - /DATA/AppData/inventaller/sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - /DATA/AppData/inventaller/sql/03_usuarios.sql:/docker-entrypoint-initdb.d/03_usuarios.sql:ro
      - /DATA/AppData/inventaller/sql/05_vistas.sql:/docker-entrypoint-initdb.d/05_vistas.sql:ro
      - /DATA/AppData/inventaller/sql/06_usuarios_app.sql:/docker-entrypoint-initdb.d/06_usuarios_app.sql:ro
      - /DATA/AppData/inventaller/sql/07_migracion_subcategorias.sql:/docker-entrypoint-initdb.d/07_migracion_subcategorias.sql:ro
      - /DATA/AppData/inventaller/sql/08_especificaciones.sql:/docker-entrypoint-initdb.d/08_especificaciones.sql:ro
      - /DATA/AppData/inventaller/sql/09_lados_frente_atras.sql:/docker-entrypoint-initdb.d/09_lados_frente_atras.sql:ro
    networks:
      - inventaller_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootPass_Cambia1!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: inventaller_app:latest
    container_name: inventaller_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: inventaller
      DB_USER: almacen_local
      DB_PASS: CambiaEstaPassword1!
    volumes:
      - /DATA/AppData/inventaller/app:/var/www/html
      - /DATA/AppData/inventaller/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    networks:
      - inventaller_net
    labels:
      # ── CasaOS metadata ──────────────────────────────────────
      casaos.app.name: "Inventario Taller"
      casaos.app.description: "Gestión de inventario para taller — equipos, ubicaciones y movimientos"
      casaos.app.icon: "https://raw.githubusercontent.com/zpma82/inventario-taller/main/README.md"
      casaos.app.webui.port: "8085"
      casaos.app.webui.path: "/"
      casaos.app.index: "http://localhost:8085"

networks:
  inventaller_net:
    name: inventaller_net
    driver: bridge
